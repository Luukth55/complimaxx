
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complimaxx - The Complete AI Platform for Audit, Risk & Compliance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              techBlack: '#05070B',
              obsidianNavy: '#0D1524',
              brightBlue: '#008CFF',
              softBlue: '#4DBAFF',
              deepDivider: '#1A2333',
              steelGrey: '#A6B3C9',
              fogGrey: '#E5EAF1',
              riskHigh: '#FF4D4F',
              riskMedium: '#FA8C16',
              riskLow: '#52C41A',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'fadeIn': 'fadeIn 0.8s ease-out forwards',
              'slideInRight': 'slideInRight 1s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(40px) perspective(1000px) rotateY(-20deg)' },
                '100%': { opacity: '1', transform: 'translateX(0) perspective(1000px) rotateY(-20deg)' },
              }
            }
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FFFFFF;
        color: #05070B;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .rotate-y-[-20deg] {
        transform: rotateY(-20deg);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F9FAFB; 
      }
      ::-webkit-scrollbar-thumb {
        background: #E5E7EB; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #008CFF; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
