
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complimaxx - The AI Operating System for GRC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              techBlack: '#05070A',
              obsidianNavy: '#0D1117',
              brightBlue: '#008CFF',
              deepDivider: '#1A1F26',
              steelGrey: '#8B949E',
              fogGrey: '#C9D1D9',
              riskHigh: '#FF4D4F',
              riskMedium: '#FA8C16',
              riskLow: '#52C41A',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'pulse-glow': 'pulseGlow 3s infinite',
              'fadeIn': 'fadeIn 1.2s ease-out forwards',
              'slideUp': 'slideUp 0.8s ease-out forwards',
              'slideInRight': 'slideInRight 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'scan-line': 'scanLine 4s linear infinite',
              'spin-slow': 'spin 15s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.4', filter: 'blur(10px)' },
                '50%': { opacity: '0.7', filter: 'blur(20px)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(50px) perspective(1200px) rotateY(-15deg)' },
                '100%': { opacity: '1', transform: 'translateX(0) perspective(1200px) rotateY(-8deg)' },
              },
              scanLine: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(400%)' }
              }
            }
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #05070A;
        color: #C9D1D9;
        margin: 0;
        overflow-x: hidden;
      }
      .perspective-1200 {
        perspective: 1200px;
      }
      .bg-tech-grid {
        background-size: 50px 50px;
        background-image: 
          linear-gradient(to right, rgba(0, 140, 255, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 140, 255, 0.05) 1px, transparent 1px);
        mask-image: radial-gradient(circle at center, black, transparent 80%);
      }
      .glow-orb {
        background: radial-gradient(circle at center, rgba(0, 140, 255, 0.15) 0%, transparent 70%);
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #1A1F26;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #008CFF;
      }
      .card-3d {
        transition: transform 0.4s ease-out;
      }
      .card-3d:hover {
        transform: translateY(-10px) rotateX(2deg) rotateY(2deg);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
